[project]
name = "whatsapp-to-calendar"
version = "0.1.0"
description = "Local AI bot that reads selected WhatsApp groups and keeps your Outlook calendar in sync"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"brain/prompts.py" = ["E501"]
